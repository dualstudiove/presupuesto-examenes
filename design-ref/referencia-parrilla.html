<title>Parrilla de Contenido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra superior fija con 4 vistas (Lista, Calendario, Objetivos, Pauta); el detalle de un post abre en dos columnas (contenido | producción). Una sola columna de 1120px. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f8f9fb;
  --ink:#14161c; --ink-2:#4b5160; --ink-3:#757c8c;
  --line:#dfe2e9; --line-2:#eceef3;
  --accent:#3342e8; --accent-ink:#ffffff; --accent-bg:#e8eaff;
  --reel:#cf2f6c; --reel-bg:#fde8f0;
  --carrusel:#2561d6; --carrusel-bg:#e5eefc;
  --foto:#0f7f64; --foto-bg:#dff3ec;
  --historia:#a86208; --historia-bg:#fcefd9;
  --diseno:#6d3fd1; --diseno-bg:#efe8fc;
  --ok:#0f7f64; --ok-bg:#dff3ec;
  --warn:#955700; --warn-bg:#fcefd9;
  --danger:#c0302a; --danger-bg:#fde9e8;
  --font-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --surface:#161a21; --surface-2:#1c212a;
    --ink:#eceff5; --ink-2:#b5bbc9; --ink-3:#8790a3;
    --line:#2a303b; --line-2:#232832;
    --accent:#8590ff; --accent-ink:#0e1015; --accent-bg:#242a55;
    --reel:#ff7fae; --reel-bg:#3b1d2b;
    --carrusel:#7aa8ff; --carrusel-bg:#1b2a48;
    --foto:#4fd1ad; --foto-bg:#143229;
    --historia:#f2b455; --historia-bg:#3b2d12;
    --diseno:#b095ff; --diseno-bg:#2b2248;
    --ok:#4fd1ad; --ok-bg:#143229;
    --warn:#f2b455; --warn-bg:#3b2d12;
    --danger:#ff8680; --danger-bg:#3e1d1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#161a21; --surface-2:#1c212a;
  --ink:#eceff5; --ink-2:#b5bbc9; --ink-3:#8790a3;
  --line:#2a303b; --line-2:#232832;
  --accent:#8590ff; --accent-ink:#0e1015; --accent-bg:#242a55;
  --reel:#ff7fae; --reel-bg:#3b1d2b;
  --carrusel:#7aa8ff; --carrusel-bg:#1b2a48;
  --foto:#4fd1ad; --foto-bg:#143229;
  --historia:#f2b455; --historia-bg:#3b2d12;
  --diseno:#b095ff; --diseno-bg:#2b2248;
  --ok:#4fd1ad; --ok-bg:#143229;
  --warn:#f2b455; --warn-bg:#3b2d12;
  --danger:#ff8680; --danger-bg:#3e1d1b;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5;
  padding-block:0 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.wrap{max-width:1120px;margin:0 auto}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.mark i{width:6px;height:6px;border-radius:1.5px;background:var(--line)}
.mark i.on{background:var(--accent)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.acct{flex:1;min-width:120px}
.acct input{border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink-2);width:100%;max-width:220px;padding:4px 2px}
.acct input:focus{border-bottom-color:var(--accent);outline:none}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
.tabs a{padding:9px 14px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Buttons and fields */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;min-height:34px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;min-height:28px;font-size:13px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-3)}
.in{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
.in.title{font-family:var(--font-display);font-size:22px;font-weight:600;padding:10px 12px;letter-spacing:-.01em}
.in.sel{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--ink-2);cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tog:hover{border-color:var(--ink-3)}
.tog[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tog.fmtbtn[aria-pressed="true"]{background:var(--cbg);border-color:var(--c);color:var(--c)}

/* Tags, pills */
.f-reel{--c:var(--reel);--cbg:var(--reel-bg)}
.f-carrusel{--c:var(--carrusel);--cbg:var(--carrusel-bg)}
.f-foto{--c:var(--foto);--cbg:var(--foto-bg)}
.f-historia{--c:var(--historia);--cbg:var(--historia-bg)}
.f-diseno{--c:var(--diseno);--cbg:var(--diseno-bg)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:6px;color:var(--c);background:var(--cbg);white-space:nowrap}
.pl{font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sbg);color:var(--sc);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-idea{--sc:var(--ink-2);--sbg:var(--line-2)}
.st-porproducir{--sc:var(--warn);--sbg:var(--warn-bg)}
.st-produccion{--sc:var(--accent);--sbg:var(--accent-bg)}
.st-listo{--sc:var(--ok);--sbg:var(--ok-bg)}
.st-publicado{--sc:var(--accent-ink);--sbg:var(--ink)}
.shoot-chip{font-size:11px;font-weight:600;color:var(--ink-2)}
.shoot-chip.done{color:var(--ok)}

/* Month bar and brief */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 12px}
.mb-nav{display:flex;align-items:center;gap:10px}
.mb-nav h2{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;min-width:0}
.mb-nav h2 span{color:var(--ink-3);font-weight:500}
.mb-nav small{color:var(--ink-3);font-size:13px}
.brief{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.brief .blk{display:flex;flex-direction:column;gap:2px;min-width:0}
.k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brief .v{font-weight:500;overflow-wrap:anywhere}
.brief .mix{display:flex;gap:6px;flex-wrap:wrap}
.lnk{color:var(--accent);text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}
.objs summary{cursor:pointer;font-weight:500}
.objs ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.note{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 14px;margin-top:14px;font-size:13px;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters .in{width:auto}
.filters input.in{min-width:160px;flex:1;max-width:260px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

/* List */
.day-group{margin-bottom:18px}
.day-h{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px;text-transform:capitalize}
.day-h span{font-weight:500;color:var(--ink-3);text-transform:none}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:inherit}
.row:hover{border-color:var(--ink-3)}
.rd{display:grid;justify-items:center;line-height:1.1}
.rd b{font-family:var(--font-display);font-size:20px;font-weight:600}
.rd span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .t em{color:var(--ink-3);font-weight:400}
.meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.mt{font-size:12px;color:var(--ink-3)}
.empty{text-align:center;padding:44px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--font-display);font-size:18px;color:var(--ink)}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal>*:nth-child(7n){border-right:0}
.dow{padding:8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);background:var(--surface-2)}
.day{min-height:112px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--ink-3)}
.day.drop{background:var(--accent-bg)}
.day-top{display:flex;justify-content:space-between;align-items:center}
.dn{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;font-family:var(--font-display);font-weight:500;font-size:12px;border-radius:11px}
.day.today .dn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.add{opacity:0;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;width:22px;height:22px;border-radius:6px}
.day:hover .add,.add:focus-visible{opacity:1}
.add:hover{background:var(--line-2);color:var(--ink)}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:5px;color:var(--c);background:var(--cbg);text-decoration:none;min-width:0;font-weight:500}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip b{font-size:9.5px;opacity:.85;font-weight:600}
.chip.pub{opacity:.6}
.chip:hover{filter:brightness(.96)}
.agenda{display:none;margin-top:16px}
.agenda .rows{margin-bottom:10px}
@media (max-width:719px){
  .day{min-height:54px;align-items:center;padding:4px 2px}
  .day-top{justify-content:center}
  .add{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .chip{width:8px;height:8px;padding:0;border-radius:50%;background:var(--c);pointer-events:none}
  .chip span,.chip b{display:none}
  .dow{padding:6px 0;text-align:center;font-size:10px;letter-spacing:0}
  .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
  .agenda{display:block}
  .legend{margin-left:0}
}

/* Detail */
.detail-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:20px 0 14px}
.dh-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrapr{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;min-height:28px}
.hint .over{color:var(--danger);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;font-weight:500;padding:2px 0}
.sw .trk{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.sw .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(14px)}
.ck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink-3);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--bg);padding:0;flex:none}
.ck svg{width:12px;height:12px;opacity:0}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.ck[aria-checked="true"] svg{opacity:1}
.edited{font-size:12px;color:var(--ink-3)}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--accent);text-decoration:none;font-weight:500;font-size:13px}
.links a:hover{border-color:var(--accent)}
.links a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.links a svg{width:13px;height:13px;flex:none}
.links.inline{flex-direction:row;flex-wrap:wrap;margin-top:6px}
.links.inline a{max-width:100%}
.shots{display:flex;flex-direction:column;gap:6px}
.shot-row{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;gap:8px;align-items:center}
.icon-x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:20px;line-height:1;border-radius:6px;height:28px}
.icon-x:hover{background:var(--line-2);color:var(--danger)}
.plabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:12px}
.pshots{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pshots li{display:flex;gap:8px;align-items:flex-start}
.pshots .ck{width:16px;height:16px;margin-top:2px}
.pshots .ck svg{width:10px;height:10px}
.pshots li.d span{text-decoration:line-through;color:var(--ink-3)}
.pvoice{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.dim{opacity:.55}

/* Goals */
.goal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:980px){.goal-grid{grid-template-columns:minmax(0,1fr)}}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.bar i{display:block;background:var(--c)}
.prog{font-size:12.5px;color:var(--ink-2)}

/* Pauta */
.ptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ptools .sp{flex:1}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px clamp(16px,4vw,44px);max-width:860px;margin:0 auto}
.doc h2{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.doc .sub{color:var(--ink-2);margin-top:2px}
.doc .sum{margin-top:12px;padding:10px 14px;background:var(--surface-2);border-radius:8px;color:var(--ink-2);font-size:13px}
.doc h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:28px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.doc h3 span{font-size:12px;color:var(--ink-3);font-weight:500}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.item .it{font-weight:600;overflow-wrap:anywhere}
.item.done .it{text-decoration:line-through;color:var(--ink-3)}
.item .det{margin-top:4px;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.item .det b{color:var(--ink);font-weight:600}
.shot{white-space:pre-wrap;margin-top:8px;padding:8px 12px;background:var(--surface-2);border-radius:8px;font-size:13px;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v5 ===== */
.day-h{text-transform:none}
.mix{display:flex;flex-wrap:wrap;gap:6px}
.top-row{flex-wrap:nowrap;gap:10px}
.acct{min-width:0}
.acct input{max-width:none}
.nw-short{display:none}
.btn.primary{white-space:nowrap}
@media (max-width:560px){.brand-name{display:none}.nw-long{display:none}.nw-short{display:inline}}

.monthbar{margin:16px 0 10px}
@media (max-width:560px){.mb-nav h2{font-size:22px}.mb-nav small{display:none}}

.hd{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr);margin-bottom:12px;overflow:hidden}
.hg{padding:12px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.hg+.hg{border-top:1px solid var(--line)}
@media (min-width:860px){.hd{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}.hg+.hg{border-top:0;border-left:1px solid var(--line)}}
.hg-main{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.hg-main .big{font-size:26px;font-weight:700}
.hg-sub{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.hg-empty{font-size:13px;color:var(--ink-3)}

<script>
(function(){
'use strict';

/* ---------- Constants ---------- */
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

var DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var DOW_LONG=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
var FORMATS={
  reel:{label:'Reel',plural:'Reels',list:'Clips a grabar'},
  carrusel:{label:'Carrusel',plural:'Carruseles',list:'Slides y material'},
  foto:{label:'Foto',plural:'Fotos',list:'Fotos a tomar'},

  diseno:{label:'Diseño',plural:'Diseños',list:'Elementos del diseño'}
};
var FICON={"reel": "data:image/png;base64,ICONO", "foto": "data:image/png;base64,ICONO", "diseno": "data:image/png;base64,ICONO", "carrusel": "data:image/png;base64,ICONO","historia":"data:image/png;base64,ICONO"};
function fIcon(k){return FICON[k]?'<img class="fi" src="'+FICON[k]+'" alt="" aria-hidden="true">':''}
var FORMAT_ORDER=['reel','foto','carrusel','historia','diseno'];
var STATUS={idea:'Idea',porproducir:'Por producir',produccion:'En producción',listo:'Listo',publicado:'Publicado'};
var PLATFORMS={ig:'Instagram',tt:'TikTok'};
var PLAT_ABBR={ig:'IG',tt:'TT'};

/* ---------- Helpers ---------- */
var main=document.getElementById('main');
var now=new Date();
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayStr(){var d=new Date();return ymd(d.getFullYear(),d.getMonth(),d.getDate())}
function dateObj(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function dowMon(dt){return (dt.getDay()+6)%7}
function monthKey(y,m){return y+'-'+pad(m+1)}
function fmtLong(s){var dt=dateObj(s);return DOW_LONG[dowMon(dt)]+' '+dt.getDate()+' de '+MONTHS[dt.getMonth()].toLowerCase()}
function whenTxt(p){if(!p.date)return 'sin fecha';var dt=dateObj(p.date);return DOW[dowMon(dt)].toLowerCase()+' '+dt.getDate()+' '+MON3[dt.getMonth()]+(p.time?' · '+p.time:'')}
function platTxt(p){return (p.platforms||[]).map(function(k){return PLATFORMS[k]}).filter(Boolean).join(' + ')}
function platAbbr(p){return ['ig','tt'].filter(function(k){return (p.platforms||[]).indexOf(k)>=0}).map(function(k){return PLAT_ABBR[k]}).join(', ')}
function plural(n,one,many){return n+' '+(n===1?one:many)}
function relTime(ts){
  var s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return 'justo ahora';
  if(s<3600)return 'hace '+Math.floor(s/60)+' min';
  if(s<86400)return 'hace '+Math.floor(s/3600)+' h';
  var d=new Date(ts);return 'el '+d.getDate()+' '+MON3[d.getMonth()];
}
function isShootDefault(f){return f==='reel'||f==='foto'}
function defaultPlats(f){return f==='reel'?['ig','tt']:['ig']}
function newId(pfx){return pfx+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var EXT_SVG='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5H3a1 1 0 0 0-1 1v5.5a1 1 0 0 0 1 1h5.5a1 1 0 0 0 1-1V7M7 2h3v3M10 2L5.5 6.5"/></svg>';
function extractLinks(text){
  var out=[],seen={};
  (String(text||'').match(/(?:https?:\/\/|www\.)[^\s<>"]+/gi)||[]).forEach(function(raw){
    var u=raw.replace(/[.,;:!?)\]}'"]+$/,'');
    if(/^www\./i.test(u))u='https://'+u;
    try{
      var x=new URL(u);
      if(x.protocol!=='http:'&&x.protocol!=='https:')return;
      if(seen[x.href])return; seen[x.href]=1;

}
function linksHtml(text,cls){
  var l=extractLinks(text); if(!l.length)return '';

}

function getShots(p){
  if(Array.isArray(p.shots)) return p.shots;
  return String(p.shotList||'').split('\n').map(function(x){return x.trim()}).filter(Boolean).map(function(t){return {t:t,d:false}});
}
function shotCount(p){var a=getShots(p);return {n:a.length,d:a.filter(function(x){return x.d}).length}}
function isTaken(p){var c=shotCount(p);return c.n?c.d===c.n:!!p.shotDone}
function voiceLines(p){return String(p.voice||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function copyShots(p){return getShots(p).map(function(x){return {t:x.t,d:!!x.d}})}
function setShots(p,arr,delay){p.shots=arr;queueSave('posts/'+p.id,{shots:arr},delay==null?600:delay)}
function toggleTaken(p){
  var sh=copyShots(p);
  if(sh.length){var all=sh.every(function(x){return x.d});setShots(p,sh.map(function(x){return {t:x.t,d:!all}}),0)}
  else{p.shotDone=!p.shotDone;queueSave('posts/'+p.id,{shotDone:p.shotDone},0)}
}

function refImgs(p){return Array.isArray(p.refImgs)?p.refImgs.filter(function(x){return x&&x.id}):[]}
function hasRefs(p){return refImgs(p).length>0||extractLinks(p.refs).length>0}
function lines(t){return String(t||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function cap(t){t=String(t||'');return t.charAt(0).toUpperCase()+t.slice(1)}
function fmtShort(ds){var d=dateObj(ds);return d.getDate()+' '+MON3[d.getMonth()]}

/* ---------- State ---------- */
var S={
  posts:new Map(), goals:new Map(), account:{},
  view:'lista', postId:null, last:'lista', detailBuilt:null,
  cy:now.getFullYear(), cm:now.getMonth(), selDay:null,
  f:{plat:'all',fmt:'all',st:'all',q:''},
  group:'tipo', showDone:true, filtersOpen:false, goalsEdit:false, pdfBusy:false, assets:null, refBusy:false, needsRender:false, lgroup:'fecha', mdel:'', mcol:(function(){try{return JSON.parse(localStorage.getItem('pc_mcol')||'{}')||{}}catch(e){return {}}})(), noClick:false,
  loaded:{posts:false,goals:false}, slow:false, booted:false,
  canWrite:true, uid:null, names:{}, focusTitle:false, roToast:false
};
var db=null, userCap=null;

function allPosts(){return Array.from(S.posts.values())}
function cmp(a,b){
  return (a.date||'9999').localeCompare(b.date||'9999')
    || (a.time||'99:99').localeCompare(b.time||'99:99')
    || (a.createdAt||0)-(b.createdAt||0);
}
function inMonth(p,y,m){return !!p.date && p.date.indexOf(monthKey(y,m)+'-')===0}
function passes(p){
  var f=S.f;
  if(f.plat!=='all' && (p.platforms||[]).indexOf(f.plat)<0) return false;
  if(f.fmt!=='all' && p.format!==f.fmt) return false;
  if(f.st!=='all' && p.status!==f.st) return false;
  if(f.q){
    var hay=((p.title||'')+' '+(p.copy||'')+' '+(p.hashtags||'')+' '+(p.direction||'')).toLowerCase();
    if(hay.indexOf(f.q.toLowerCase())<0) return false;
  }
  return true;
}
function stats(y,m){
  var o={total:0,pub:0,by:{},stories:0};
  allPosts().forEach(function(p){
    if(!inMonth(p,y,m))return;
    if(p.format==='historia'){o.stories++;return}
    o.total++; if(p.status==='publicado')o.pub++;
    o.by[p.format]=(o.by[p.format]||0)+1;
  });
  return o;
}

/* ---------- Toast ---------- */
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on')},2600);
}

/* ---------- Writes ---------- */
var pending={}, chain={};
function canW(){
  if(S.canWrite) return true;
  toast('Solo lectura: pide a tu socio acceso de colaborador.');
  return false;
}
function queueSave(path,patch,delay){
  if(!db||!canW()) return;
  var e=pending[path]||(pending[path]={patch:{},timer:null});
  Object.assign(e.patch,patch);
  clearTimeout(e.timer);
  if(delay===0) flush(path); else e.timer=setTimeout(function(){flush(path)},delay==null?500:delay);
}
function flush(path){
  var e=pending[path]; if(!e) return;
  clearTimeout(e.timer); delete pending[path];
  var patch=Object.assign({},e.patch,{updatedAt:Date.now(),updatedBy:S.uid||null});
  chain[path]=(chain[path]||Promise.resolve()).then(function(){
    var ref=db.doc(path);
    return ref.update(patch).catch(function(err){
      if(err&&err.code==='invalid_argument'){
        if(path.indexOf('posts/')!==0){
          return ref.set(Object.assign({createdAt:Date.now(),createdBy:S.uid||null},patch)).catch(fail);
        }
        toast('No se pudo guardar. Puede que el post haya sido eliminado.');
        return;
      }
      fail(err);
    });
  });
}
function flushAll(){Object.keys(pending).forEach(flush)}
function fail(err){
  toast(err&&err.code==='quota_exceeded'?'Se alcanzó el límite de almacenamiento.':'No se pudo guardar. Revisa tu conexión.');
}
function createPost(data){

  var doc=Object.assign({
    title:'',format:fmt,platforms:defaultPlats(fmt),date:'',time:'',status:'idea',

function parseNum(v){
  if(v==null)return null;
  var t=String(v).trim().replace(/\s/g,'').replace(/%$/,'');
  if(!t)return null;
  if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  var n=Number(t);
  return isFinite(n)?n:null;
}
function decOf(n){var s=String(n),i=s.indexOf('.');return i<0?0:Math.min(2,s.length-i-1)}
function fmtNum(n,d){
  if(n==null||!isFinite(n))return '–';
  var s=Math.abs(n).toFixed(d||0).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (n<0?'−':'')+s.join(',');
}
function sgnNum(n,d){return (n>0?'+':'')+fmtNum(n,d)}
function valStr(n){return n==null||n===''?'':String(n).replace('.',',')}
function hasNum(v){return v!=null&&v!==''&&isFinite(Number(v))}
/* Hitos: crecimiento compuesto (el primer mes es el más lento). Con un mes ajustado, los otros dos se reparten el resto. */
function calcMilestones(cur,tar,pin){
  if(!hasNum(cur)||!hasNum(tar))return null;
  cur=Number(cur);tar=Number(tar);
  var pm=-1,pd=0;
  if(pin&&pin.m>=0&&pin.m<=2&&hasNum(pin.d)){pm=Number(pin.m);pd=Number(pin.d)}
  var d=Math.max(decOf(cur),decOf(tar),pm>=0?decOf(pd):0), k=Math.pow(10,d);
  function rnd(x){return Math.round(x*k)/k}
  var total=tar-cur, w=[1,1,1];
  if(cur>0&&tar>0&&cur!==tar){var g=Math.pow(tar/cur,1/3);w=[1,g,g*g]}
  var delta=[0,0,0], warn=false;
  if(pm>=0){
    var o=[0,1,2].filter(function(i){return i!==pm}), rem=total-pd, ws=w[o[0]]+w[o[1]];
    delta[pm]=pd;
    o.forEach(function(i){delta[i]=rem*w[i]/ws});
    if(total!==0&&(rem*total<0||pd*total<0))warn=true;
  } else {
    var s3=w[0]+w[1]+w[2];
    for(var i=0;i<3;i++)delta[i]=total*w[i]/s3;
  }
  var E=[cur+delta[0],cur+delta[0]+delta[1],tar], R=[];
  for(var j=0;j<3;j++){var prev=j?R[j-1]:cur;R[j]=(j===pm&&j<2)?rnd(prev+pd):rnd(E[j])}
  R[2]=rnd(tar);
  return {end:R,inc:[rnd(R[0]-cur),rnd(R[1]-R[0]),rnd(R[2]-R[1])],d:d,warn:warn,pm:pm};
}
function monthEnded(y,mi){return todayStr()>ymd(y,mi,new Date(y,mi+1,0).getDate())}
function msStatus(m,i,ms,y,mi){
  var real=m.real&&m.real[i], has=hasNum(real), dir=Number(m.tar)>=Number(m.cur)?1:-1;
  var reached=has&&(dir>0?Number(real)>=ms.end[i]:Number(real)<=ms.end[i]);
  if(reached)return {k:'ok',t:'Cumplido'};
  if(monthEnded(y,mi))return has?{k:'bad',t:'No cumplido'}:{k:'miss',t:'Sin registrar'};
  return has?{k:'run',t:'En curso'}:{k:'pend',t:'Pendiente'};
}
function qStatus(m,y,qn){
  var last=-1;
  for(var i=0;i<3;i++)if(hasNum(m.real&&m.real[i]))last=i;
  var c=Number(m.cur),t=Number(m.tar),dir=t>=c?1:-1, real=last>=0?Number(m.real[last]):null;
  var reached=real!=null&&(dir>0?real>=t:real<=t), pct=null;
  if(real!=null&&t!==c)pct=Math.max(0,Math.min(100,Math.round((real-c)/(t-c)*100)));
  var s;
  if(reached)s={k:'ok',t:'Objetivo cumplido'};
  else if(monthEnded(y,qn*3+2))s=real!=null?{k:'bad',t:'No cumplido'}:{k:'miss',t:'Sin registrar'};

  s.pct=pct;return s;
}

function weekLabel(ds){

function pautaData(){
  var y=S.cy,m=S.cm;
  var all=allPosts().filter(function(p){return p.shoot&&inMonth(p,y,m)}).sort(cmp);
  var done=all.filter(isTaken).length;
  var items=S.showDone?all:all.filter(function(p){return !isTaken(p)});
  var groups=[];
  if(S.group==='locacion'){
    var map={}, order=[];
    items.forEach(function(p){
      var key=(p.location||'').trim().toLowerCase();
      if(!map[key]){map[key]={title:key?(p.location||'').trim():'Sin locación definida',items:[],key:key};order.push(key)}
      map[key].items.push(p);
    });
    order.sort(function(a,b){if(!a)return 1;if(!b)return -1;return a.localeCompare(b)});
    groups=order.map(function(k){return map[k]});
  } else if(S.group==='fecha'){
    var wm={}, wo=[];
    items.forEach(function(p){var k=mondayOf(p.date);if(!wm[k]){wm[k]={title:weekLabel(k),items:[]};wo.push(k)}wm[k].items.push(p)});
    wo.sort();
    groups=wo.map(function(k){return wm[k]});
  } else {
    FORMAT_ORDER.forEach(function(f){
      var it=items.filter(function(p){return p.format===f});
      if(it.length) groups.push({title:FORMATS[f].plural,icon:fIcon(f),items:it});
    });
  }
  return {all:all,done:done,items:items,groups:groups,
    noShoot:allPosts().filter(function(p){return !p.shoot&&inMonth(p,y,m)}).length};
}

/* ---------- PDF (Dual Studio) ---------- */
function pdfClean(t){
  return String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-')
    .replace(/…/g,'...').replace(/•/g,'-').replace(/ /g,' ').replace(/[^\u0000-ÿ]/g,'');
}
function loadImgData(id){
  return new Promise(function(res){
    if(typeof Image==='undefined'){res(null);return}
    var img=new Image();
    img.onload=function(){
      try{
        var s=Math.min(1,1500/Math.max(img.naturalWidth,img.naturalHeight)), cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.naturalWidth*s));cv.height=Math.max(1,Math.round(img.naturalHeight*s));
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
        res({d:cv.toDataURL('image/jpeg',0.8),w:cv.width,h:cv.height});
      }catch(e){res(null)}
    };
    img.onerror=function(){res(null)};
    img.src='/_blob/'+id;
  });
}
function pdfImageIds(d){
  var ids=[];
  d.items.forEach(function(p){if(p.refShow!==false)refImgs(p).forEach(function(x){if(ids.indexOf(x.id)<0)ids.push(x.id)})});
  return ids;

function buildPdf(d,imgs){
  var J=window.jspdf&&window.jspdf.jsPDF; if(!J)return null;
  imgs=imgs||{};
  var doc=new J({unit:'pt',format:'letter'});
  var W=612,H=792,M=40,CW=W-2*M,TOP=46,BOT=H-54,y=TOP,PAD=12,CKW=26,IX=M+PAD+CKW,IW=CW-2*PAD-CKW;
  var C={ink:'#14161c',ink2:'#4b5160',ink3:'#757c8c',line:'#dfe2e9',soft:'#f3f4f7',ok:'#0f7f64',accent:'#3342e8',white:'#ffffff'};
  var FC={reel:['#cf2f6c','#fde8f0'],carrusel:['#2561d6','#e5eefc'],foto:['#0f7f64','#dff3ec'],historia:['#a86208','#fcefd9'],diseno:['#6d3fd1','#efe8fc']};
  var handle=pdfClean((S.account.handle||'').trim());
  function rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function fill(h){var c=rgb(h);doc.setFillColor(c[0],c[1],c[2])}
  function stroke(h){var c=rgb(h);doc.setDrawColor(c[0],c[1],c[2])}
  function ink(h){var c=rgb(h);doc.setTextColor(c[0],c[1],c[2])}
  function font(style,size,color){doc.setFont('helvetica',style);doc.setFontSize(size);ink(color)}
  function newPage(){doc.addPage();y=TOP}
  function box(x,by,sz,on){
    if(on){
      fill(C.ok);stroke(C.ok);doc.setLineWidth(1);doc.roundedRect(x,by,sz,sz,2.5,2.5,'FD');
      stroke(C.white);doc.setLineWidth(sz>12?1.8:1.4);
      doc.line(x+sz*.24,by+sz*.52,x+sz*.43,by+sz*.72);doc.line(x+sz*.43,by+sz*.72,x+sz*.78,by+sz*.28);
    } else {
      fill(C.white);stroke(C.ink3);doc.setLineWidth(1.1);doc.roundedRect(x,by,sz,sz,2.5,2.5,'FD');
    }
  }
  function wrap(text,size,style,width,label){
    font(style,size,C.ink);
    var lw=0;
    if(label){doc.setFont('helvetica','bold');lw=doc.getTextWidth(label+' ');doc.setFont('helvetica',style)}
    var out=[];
    pdfClean(text).split('\n').forEach(function(par){
      var words=par.split(/\s+/).filter(Boolean), line='';
      if(!words.length){out.push('');return}
      words.forEach(function(w){
        var avail=width-(out.length===0?lw:0), test=line?line+' '+w:w;
        if(doc.getTextWidth(test)<=avail){line=test;return}
        if(line){out.push(line);line='';avail=width}
        if(doc.getTextWidth(w)>avail){var parts=doc.splitTextToSize(w,avail);for(var i=0;i<parts.length-1;i++)out.push(parts[i]);line=parts[parts.length-1]}
        else line=w;
      });
      out.push(line);
    });
    return {lines:out,lw:lw};
  }
  function strike(x,by,w,col){stroke(col);doc.setLineWidth(.8);doc.line(x,by,x+w,by)}

  function itemOps(p){
    var f=FORMATS[p.format]||FORMATS.reel, fc=FC[p.format]||FC.reel, taken=isTaken(p), ops=[];
    var tag=pdfClean(f.label), ico=FICON[p.format]; font('bold',8.5,C.ink); var tw=doc.getTextWidth(tag)+14+(ico?13:0);
    var tt=wrap(p.title||'Sin título',12.5,'bold',IW-tw-10), tlh=16;
    ops.push({h:tt.lines.length*tlh+4,keep:true,draw:function(yy){

    }});

        w.lines.forEach(function(l,i){

      }});
    }
    function section(label){
      ops.push({h:22,keep:true,draw:function(yy){font('bold',7.5,C.ink3);doc.text(pdfClean(label).toUpperCase(),IX,yy+15)}});
    }
    para('Publica:',whenTxt(p)+' · '+platTxt(p));
    if(p.location)para('Locación:',p.location);
    if(p.props)para('Props / vestuario:',p.props);

    var shots=getShots(p), voice=voiceLines(p);
    if(shots.length){

        var w=wrap(s.t,9.5,'normal',IW-20);
        ops.push({h:w.lines.length*13+5,draw:function(yy){
          box(IX,yy+1,10,!!s.d);

      if(pics.length||links.length){
        section('Referencias');
        var IMGH=180, rows=[], cur=[], cw=0, rh=0;
        pics.forEach(function(im){
          var h=IMGH, w=h*im.w/im.h; if(w>IW){w=IW;h=w*im.h/im.w}
          if(cur.length&&cw+8+w>IW){rows.push({items:cur,h:rh});cur=[];cw=0;rh=0}
          cur.push({im:im,w:w,h:h});cw+=(cur.length>1?8:0)+w;rh=Math.max(rh,h);

  }
  function drawItem(p){
    var ops=itemOps(p), total=PAD*2+ops.reduce(function(a,o){return a+o.h},0);

    var cy0=y; y+=PAD;

  var total=doc.getNumberOfPages();
  for(var i=1;i<=total;i++){
    doc.setPage(i);
    font('normal',8.5,C.ink3);
    doc.text('Dual Studio'+(handle?'  |  '+handle:''),M,H-28);
    doc.text(i+' / '+total,W-M,H-28,{align:'right'});

function prepImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      try{
        var s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.naturalWidth*s));cv.height=Math.max(1,Math.round(img.naturalHeight*s));
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.85);
      }catch(e){rej(e)}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}
function upErr(err){
  var c=err&&err.code;
  if(c==='too_large')return 'La imagen es demasiado grande.';
  if(c==='quota_or_state')return 'Se llenó el espacio de imágenes de la app.';
  if(c==='rate_limited')return 'Demasiadas subidas seguidas. Espera un momento.';
  return 'No se pudo subir una imagen. Prueba con JPG o PNG.';
}
function addRefFiles(files){
  var p=S.posts.get(S.postId); if(!p||!canW())return;
  if(!S.assets){toast('Tu nivel de acceso no permite subir imágenes.');return}
  var list=Array.prototype.filter.call(files||[],function(f){return /^image\//.test(f.type)});
  if(!list.length){toast('Elige archivos de imagen.');return}
  var pid=p.id, added=[], ch=Promise.resolve();
  S.refBusy=true; setRefStatus('Subiendo '+plural(list.length,'imagen','imágenes')+'…');
  list.forEach(function(f){
    ch=ch.then(function(){
      return prepImage(f).then(function(b){return S.assets.upload(b,{type:'image/jpeg'})}).then(function(r){added.push({id:r.id})},function(err){toast(upErr(err))});
    });
  });
  ch.then(function(){
    S.refBusy=false; setRefStatus('');
    var cur=S.posts.get(pid); if(!cur||!added.length)return;
    var arr=refImgs(cur).concat(added); cur.refImgs=arr; queueSave('posts/'+pid,{refImgs:arr},0);
    if(S.view==='detalle'&&S.postId===pid)paintRefs(cur);
  });
}

function render(toTop){
  if(DR&&DR.active){S.needsRender=true;return}
  setNav();
  if(S.view==='detalle'){paintDetail(); if(toTop)window.scrollTo(0,0); return}
  S.detailBuilt=null;
  var ae=document.activeElement, keep=null;
  if(ae&&ae.id&&main.contains(ae)&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')){
    keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  }
  var sy=window.scrollY;
  ({lista:viewLista,calendario:viewCal,objetivos:viewObj,pauta:viewPauta})[S.view]();
  if(keep){
    var el=document.getElementById(keep.id);
    if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}
  }
  window.scrollTo(0,toTop?0:sy);
}
function onData(pendingWrites){
  if(S.view==='detalle'){paintDetail();return}
  if(pendingWrites&&S.view==='objetivos')return;
  render();
}

/* ---------- Clipboard and downloads ---------- */
function copyText(t,msg){
  var ok=function(){toast(msg||'Copiado')};
  var fb=function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var r=false;
    try{r=document.execCommand('copy')}catch(e){}
    ta.remove();
    if(r)ok(); else toast('No se pudo copiar. Selecciona el texto y cópialo a mano.');
  };
  try{ navigator.clipboard.writeText(t).then(ok,fb) }catch(e){fb()}
}
function download(name,text){
  var p=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);
  Promise.resolve(p).catch(function(){return null}).then(function(d){
    if(!d){toast('La descarga no está disponible en esta vista.');return}
    return d.save({filename:name,data:text}).then(function(){toast('Archivo listo')},function(e){if(!e||e.code!=='declined')toast('No se pudo descargar el archivo.')});
  });
}

/* Drag to reschedule (mouse and touch) */
var DR=null, scrollT=null;
function dayAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.day'):null}
function moveGhost(x,y){if(DR&&DR.ghost){DR.ghost.style.left=(x-30)+'px';DR.ghost.style.top=(y-16)+'px'}}
function markDrop(){
  var d=dayAt(DR.x,DR.y);
  if(DR.over&&DR.over!==d)DR.over.classList.remove('drop');
  if(d)d.classList.add('drop');
  DR.over=d;
}
function dragStart(){
  if(!DR||DR.active)return;
  DR.active=true; clearTimeout(DR.timer);
  var r=DR.src.getBoundingClientRect();
  var g=DR.src.cloneNode(true);
  g.removeAttribute('href'); g.removeAttribute('data-drag'); g.classList.add('drag-ghost');
  g.style.width=Math.max(150,Math.min(r.width||200,300))+'px';
  document.body.appendChild(g); DR.ghost=g; DR.src.classList.add('drag-src');
  document.body.classList.add('dragging');
  moveGhost(DR.x,DR.y);
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
  scrollT=setInterval(function(){
    if(!DR||!DR.active)return;
    var h=window.innerHeight||600;
    if(DR.y<70)window.scrollBy(0,-14); else if(DR.y>h-70)window.scrollBy(0,14);
    markDrop();
  },30);
}
function dragEnd(drop){
  if(!DR)return;
  var d=DR; clearTimeout(d.timer); clearInterval(scrollT);
  var moved=false;
  if(d.active){
    S.noClick=true; setTimeout(function(){S.noClick=false},400);
    if(d.over)d.over.classList.remove('drop');
    if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
    d.src.classList.remove('drag-src');
    document.body.classList.remove('dragging');
    if(drop){
      var day=dayAt(d.x,d.y), p=S.posts.get(d.id);
      if(day&&p&&day.dataset.date&&p.date!==day.dataset.date){
        p.date=day.dataset.date; queueSave('posts/'+p.id,{date:p.date},0);
        S.selDay=p.date; moved=true; toast('Movido al '+fmtShort(p.date));
      }
    }
  }
  DR=null;
  if(moved||S.needsRender){S.needsRender=false;render()}
}
document.addEventListener('pointerdown',function(e){
  if(S.view!=='calendario'||!S.canWrite||DR)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest&&e.target.closest('select'))return;
  var src=e.target.closest&&e.target.closest('[data-drag]'); if(!src)return;
  DR={id:src.dataset.drag,src:src,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,touch:e.pointerType!=='mouse',active:false,pid:e.pointerId,over:null,ghost:null,timer:null};
  if(DR.touch)DR.timer=setTimeout(dragStart,300);
});
document.addEventListener('pointermove',function(e){
  if(!DR||e.pointerId!==DR.pid)return;
  DR.x=e.clientX; DR.y=e.clientY;
  if(!DR.active){
    var dx=Math.abs(DR.x-DR.sx), dy=Math.abs(DR.y-DR.sy);
    if(DR.touch){if(dx>10||dy>10){clearTimeout(DR.timer);DR=null}}
    else if(dx>5||dy>5)dragStart();
    return;
  }
  moveGhost(DR.x,DR.y); markDrop();
});
document.addEventListener('pointerup',function(e){if(DR&&e.pointerId===DR.pid)dragEnd(true)});
document.addEventListener('pointercancel',function(e){if(DR&&e.pointerId===DR.pid)dragEnd(false)});
document.addEventListener('touchmove',function(e){if(DR&&DR.active&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(DR&&DR.active)e.preventDefault()});
document.addEventListener('click',function(e){if(S.noClick){e.preventDefault();e.stopPropagation()}},true);

/* Image paste / drop in references */
function imageFiles(dt){
  var out=[]; if(!dt)return out;
  if(dt.files&&dt.files.length)Array.prototype.forEach.call(dt.files,function(f){if(/^image\//.test(f.type))out.push(f)});
  if(!out.length&&dt.items)Array.prototype.forEach.call(dt.items,function(it){if(it.kind==='file'&&/^image\//.test(it.type)){var f=it.getAsFile();if(f)out.push(f)}});
  return out;
}
document.addEventListener('paste',function(e){
  if(!e.target||e.target.id!=='f-refs')return;
  var fs=imageFiles(e.clipboardData); if(!fs.length)return;
  e.preventDefault(); addRefFiles(fs);
});
document.addEventListener('dragover',function(e){
  var b=e.target.closest&&e.target.closest('#refBox'); if(!b)return;
  e.preventDefault(); b.classList.add('over');
});
document.addEventListener('dragleave',function(e){
  var b=e.target.closest&&e.target.closest('#refBox'); if(b)b.classList.remove('over');
});
document.addEventListener('drop',function(e){
  var b=e.target.closest&&e.target.closest('#refBox'); if(!b)return;
  e.preventDefault(); b.classList.remove('over'); addRefFiles(imageFiles(e.dataTransfer));
});

/* ---------- Boot ---------- */
function resolveNames(){
  if(!userCap||!userCap.profiles)return;
  var ids=[];
  S.posts.forEach(function(p){if(p.updatedBy&&!(p.updatedBy in S.names)&&ids.indexOf(p.updatedBy)<0)ids.push(p.updatedBy)});
  if(!ids.length)return;
  ids.forEach(function(i){S.names[i]=''});
  userCap.profiles(ids).then(function(ps){
    ids.forEach(function(i){S.names[i]=(ps&&ps[i]&&ps[i].name)||''});
    if(S.view==='detalle')paintFooter();
  },function(){});
}
function subscribe(){
  var timer=setTimeout(function(){S.slow=true;render()},10000);
  function ready(snap){if(!snap.metadata.fromCache){clearTimeout(timer);S.slow=false}}
  function bad(){clearTimeout(timer);S.slow=false;render()}
  db.collection('posts').onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){m.set(d.id,Object.assign({id:d.id},d.data()))});
    S.posts=m;S.loaded.posts=true;ready(snap);resolveNames();onData(snap.metadata.hasPendingWrites);
  },bad);
  db.collection('goals').onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){m.set(d.id,Object.assign({id:d.id},d.data()))});
    S.goals=m;S.loaded.goals=true;ready(snap);
    if(S.view!=='detalle')onData(snap.metadata.hasPendingWrites);
  },bad);
  db.doc('settings/account').onSnapshot(function(snap){
    S.account=snap.exists?snap.data():{};
    var el=document.getElementById('acct');
    if(el&&el!==document.activeElement&&el.value!==(S.account.handle||''))el.value=S.account.handle||'';
    if(S.view==='pauta'&&!snap.metadata.hasPendingWrites)render();
  },function(){});
}
function boot(){
  route();render(true);
  var c=window.claude;
  if(!c||!c.use){S.booted=true;render();return}
  Promise.all([
    c.use('db').catch(function(){return null}),
    c.use('user').catch(function(){return null}),
    c.use('assets').catch(function(){return null})
  ]).then(function(r){
    db=r[0];userCap=r[1];S.assets=r[2]||null;S.booted=true;
    var jobs=[];
    if(userCap){
      jobs.push(Promise.resolve(userCap.id()).then(function(id){S.uid=id},function(){}));
      jobs.push(Promise.resolve(userCap.can('data.write')).then(function(v){if(v===false)S.canWrite=false},function(){}));
    }
    return Promise.all(jobs);
  }).then(function(){
    if(!db){render();return}
    subscribe();render();
  });
}
boot();
})();
