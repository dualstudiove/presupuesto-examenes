<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dual Studio · Apps</title>
  <meta name="description" content="Aplicaciones de Dual Studio en desarrollo y en pruebas.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/central.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <span class="mark" aria-hidden="true"><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i></span>
      <div>
        <h1>Dual Studio</h1>
        <p class="sub">Aplicaciones en desarrollo. Se prueban aquí con un grupo pequeño de personas antes de lanzarse.</p>
      </div>
    </header>

    <p class="k">Aplicaciones</p>
    <!--
      Para agregar una app, copia uno de estos bloques.
      · href: su ruta en este dominio (/nombre) o, cuando se mude, su dominio propio (https://…).
      · Estado: <span class="st ok">En pruebas</span> · <span class="st soon">Próximamente</span>
      Una app que aún no está publicada va como <div class="app off"> (sin enlace).
    -->
    <div class="apps">
      <a class="app" href="/cotizalo">
        <span class="ico c1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.2L4.6 18.4A2 2 0 0 0 6.3 21.5h11.4a2 2 0 0 0 1.7-3.1L14 9.2V3"/><path d="M7.5 15h9"/></svg></span>
        <span class="txt"><b>Cotízalo</b><span>Presupuestos de exámenes para laboratorios clínicos.</span></span>
        <span class="st ok">En pruebas</span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <div class="app off" aria-disabled="true">
        <span class="ico c2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <span class="txt"><b>Planifica</b><span>Muy pronto.</span></span>
        <span class="st soon">Próximamente</span>
      </div>
    </div>

    <footer class="foot">© Dual Studio</footer>
  </main>
</body>
</html>
